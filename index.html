<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="calculator">
        <div class="display">
          <input class="input-a" type="text" step="any" placeholder="A" />
          <span id="operation-symbol">?</span>
          <input class="input-b" type="text" step="any" placeholder="B" />
          <button class="equal-button" onclick="performCalculation()">=</button>
          <span id="calc-result">0</span>
        </div>
        <div class="error-message"></div>
        <div class="controls">
          <button class="operation-btn percent" onclick="togglePercent()">%</button>
          <button class="operation-btn" onclick="selectOperation('^', exponentiation)">x^z</button>
          <button class="operation-btn" onclick="selectOperation('√', squareRoot)">√</button>
          <button class="operation-btn" onclick="selectOperation('+', add)">+</button>
          <button class="operation-btn" onclick="selectOperation('-', subtract)">-</button>
          <button class="operation-btn" onclick="selectOperation('*', multiply)">*</button>
          <button class="operation-btn" onclick="selectOperation('/', divide)">/</button>
          <button onclick="clearAll()">C</button>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
